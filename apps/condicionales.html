<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Condicionales · Mundo Sofi</title><link rel="stylesheet" href="../assets/style.css"><style>body{display:flex;justify-content:center}.game-left{width:45%;min-width:330px}.game-right{flex:1;display:flex;flex-direction:column;gap:14px}.stat-val small{color:var(--text-dim);font-size:.7rem}.celebration{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#090915bb;z-index:5}.celebration.show{display:flex}.celebration-card{background:#19192a;padding:32px;border-radius:20px;text-align:center;max-width:390px}.celebration-title{font-size:1.5rem;font-weight:900;margin:8px}.celebration-sub{color:var(--text-mid);margin-bottom:18px}@media(max-width:760px){.game-left{width:100%;min-width:0}}</style></head><body data-mode="condicionales"><div class="stars-bg" id="stars"></div><main class="page"><nav class="top-nav"><a href="../index.html" class="btn btn-ghost">🏠 Inicio</a><h1 class="gradient-text" id="title"></h1><div class="level-tabs" id="tabs"></div></nav><div class="game-layout"><section class="game-left"><div class="card"><p id="desc" style="margin-bottom:12px;color:var(--text-mid)"></p><textarea id="code" class="code-editor"></textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" onclick="runProgram()">▶️ Ejecutar</button><button class="btn btn-yellow" onclick="retryLevel()">↪ Reintentar</button></div><div id="log" class="log" style="margin-top:14px"></div></div><div id="help" class="help" style="margin-top:14px"></div></section><section class="game-right"><div class="card stats-panel" id="stats"></div><div class="concept-box" id="concept"></div><div class="card"><p class="robot-info" id="info"></p><div id="grid" class="grid-wrap" style="margin-top:10px"></div></div></section></div></main><div class="celebration" id="celebration"><div class="celebration-card"><div style="font-size:3rem">⭐</div><div class="celebration-title" id="celebTitle"></div><div class="celebration-sub" id="celebSub"></div><button class="btn btn-green" id="celebNext" onclick="nextLevel()">Siguiente nivel ›</button><button class="btn btn-ghost" onclick="closeCelebration()">Jugar otra vez</button></div></div><script src="../assets/progress.js"></script><script src="../assets/robot-game.js"></script></body></html>
